<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0014"/>
      <stop offset="100%" stop-color="#1a0030"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B026FF"/>
      <stop offset="50%" stop-color="#9D00FF"/>
      <stop offset="100%" stop-color="#C77DFF"/>
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="500" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="500" fill="none" stroke="#B026FF" stroke-opacity="0.35" stroke-width="2"/>

  <!-- faint grid lines for tech feel -->
  <g stroke="#B026FF" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="125" x2="1200" y2="125"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="375" x2="1200" y2="375"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="900" y1="0" x2="900" y2="500"/>
  </g>

  <!-- TOP: Extension Name -->
  <text x="600" y="75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="46" font-weight="bold" fill="#E8C7FF" filter="url(#neonGlow)">
    ⚡ FamGateway — Paymenter Extension ⚡
  </text>
  <text x="600" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="18" fill="#C77DFF" opacity="0.85">
    Zero-Fee P2P UPI Payment Gateway for Paymenter
  </text>

  <line x1="150" y1="135" x2="1050" y2="135" stroke="url(#purpleGrad)" stroke-width="2" opacity="0.6"/>

  <!-- MIDDLE: Flow Graphic -->
  <g font-family="Arial, Helvetica, sans-serif">

    <!-- Node 1 -->
    <rect x="60" y="215" width="190" height="80" rx="14" fill="#1a0030" stroke="#B026FF" stroke-width="2" filter="url(#softGlow)"/>
    <text x="155" y="248" text-anchor="middle" font-size="16" font-weight="bold" fill="#E8C7FF">Customer</text>
    <text x="155" y="270" text-anchor="middle" font-size="13" fill="#C77DFF">Checkout / QR Pay</text>

    <!-- arrow 1 -->
    <line x1="250" y1="255" x2="330" y2="255" stroke="#B026FF" stroke-width="3" filter="url(#softGlow)"/>
    <polygon points="330,248 345,255 330,262" fill="#B026FF"/>

    <!-- Node 2 -->
    <rect x="350" y="215" width="200" height="80" rx="14" fill="#1a0030" stroke="#9D00FF" stroke-width="2" filter="url(#softGlow)"/>
    <text x="450" y="242" text-anchor="middle" font-size="16" font-weight="bold" fill="#E8C7FF">FamGateway.php</text>
    <text x="450" y="262" text-anchor="middle" font-size="13" fill="#C77DFF">pay() → createOrder</text>
    <text x="450" y="280" text-anchor="middle" font-size="13" fill="#C77DFF">API</text>

    <!-- arrow 2 -->
    <line x1="550" y1="255" x2="630" y2="255" stroke="#9D00FF" stroke-width="3" filter="url(#softGlow)"/>
    <polygon points="630,248 645,255 630,262" fill="#9D00FF"/>

    <!-- Node 3 -->
    <rect x="650" y="215" width="200" height="80" rx="14" fill="#1a0030" stroke="#B026FF" stroke-width="2" filter="url(#softGlow)"/>
    <text x="750" y="242" text-anchor="middle" font-size="16" font-weight="bold" fill="#E8C7FF">webhook()</text>
    <text x="750" y="262" text-anchor="middle" font-size="13" fill="#C77DFF">HMAC-SHA256</text>
    <text x="750" y="280" text-anchor="middle" font-size="13" fill="#C77DFF">Signature Verify</text>

    <!-- arrow 3 -->
    <line x1="850" y1="255" x2="930" y2="255" stroke="#B026FF" stroke-width="3" filter="url(#softGlow)"/>
    <polygon points="930,248 945,255 930,262" fill="#B026FF"/>

    <!-- Node 4 -->
    <rect x="950" y="215" width="190" height="80" rx="14" fill="#1a0030" stroke="#C77DFF" stroke-width="2" filter="url(#softGlow)"/>
    <text x="1045" y="248" text-anchor="middle" font-size="16" font-weight="bold" fill="#E8C7FF">Invoice</text>
    <text x="1045" y="270" text-anchor="middle" font-size="13" fill="#39FF14">✔ Marked PAID</text>

  </g>

  <!-- Info strip under diagram -->
  <text x="600" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="14" fill="#C77DFF" opacity="0.9">
    PHP 8.1+  •  Paymenter Gateway Extension  •  INR / UPI Only  •  MIT License
  </text>

  <line x1="150" y1="365" x2="1050" y2="365" stroke="url(#purpleGrad)" stroke-width="2" opacity="0.6"/>

  <!-- BOTTOM: Owner / Developer Info -->
  <text x="600" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="22" font-weight="bold" fill="#E8C7FF" filter="url(#softGlow)">
    Owner : Pawan
  </text>
  <text x="600" y="438" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#C77DFF">
    Developer / Maintainer — github.com/ALLAY-XD-20
  </text>
  <text x="600" y="465" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="13" fill="#9D00FF" opacity="0.8">
    Repository: FamGateway-Paymenter
  </text>

</svg>
